services:
  - type: web
    name: primhora-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    # Alembic uses MIGRATION_DATABASE_URL; the API process uses DATABASE_URL.
    # Configure both as secrets in Render before activating the restricted role.
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: false
      - key: DEMO_ALLOW_GLOBAL_RESET
        value: false
      - key: DEMO_ALLOW_EXTERNAL_INGESTION
        value: false
      - key: DEMO_BOOTSTRAP_ON_START
        value: false
      - key: SEED
        value: 42
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_PROVIDER_DOMAIN
        sync: false
      - key: AUTH_PROVIDER_ISSUER
        sync: false
      - key: AUTH_PROVIDER_AUDIENCE
        sync: false
      - key: AUTH_PROVIDER_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAY_MERCHANT_ID
        sync: false
      - key: RAZORPAY_TENANT_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
