services:
  - type: web
    name: primhora-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Supabase PostgreSQL Session Pooler connection string. Set as a secret in Render.
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: true
      - key: DEMO_BOOTSTRAP_ON_START
        value: false
      - key: SEED
        value: 42
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_PROVIDER_DOMAIN
        sync: false
      - key: AUTH_PROVIDER_ISSUER
        sync: false
      - key: AUTH_PROVIDER_AUDIENCE
        sync: false
      - key: AUTH_PROVIDER_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAY_MERCHANT_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
